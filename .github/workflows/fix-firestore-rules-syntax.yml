name: Fix Firestore rules syntax

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-firestore-rules-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch rules
        run: python tools/fix-firestore-rules-syntax.py
      - name: Compile Firestore rules in local emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-tpp-direc "echo firestore-rules-compiled"
      - name: Commit repaired rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Fix Firestore rules syntax" || exit 0
          git push
