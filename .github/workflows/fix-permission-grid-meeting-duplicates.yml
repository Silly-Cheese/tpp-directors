name: Fix permission grid and meeting duplicates

on:
  push:
    paths:
      - '.github/workflows/fix-permission-grid-meeting-duplicates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python tools/fix-permission-grid-meeting-duplicates.py
      - name: Verify JavaScript syntax
        run: |
          node --check js/phase5.js
          node --check js/meeting-data.js
          node --check js/permissions.js
          node --check js/phase6.js
          node --check js/boot-stable.js
      - name: Commit repaired portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/permissions.js js/phase5.js js/phase6.js js/meeting-data.js firestore.rules portal-theme-v3.css index.html js/boot-stable.js
          git commit -m "Fix permission editor and prevent duplicate meetings" || exit 0
          git push
