name: Stabilize Meetings and Agenda

on:
  push:
    paths:
      - .github/workflows/stabilize-meetings-agenda.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Meetings and Agenda
        run: |
          python .github/scripts/stabilize_meetings_agenda.py
          node --check js/phase5.js
          node --check js/phase6.js
          node --check js/firebase.js
          grep -q '__TPP_SELECTED_MEETING_ID__' js/phase5.js
          grep -q 'select name="itemType"' js/phase6.js
          ! grep -q 'phase5-polish.js' js/firebase.js
      - name: Commit stabilized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add js/phase5.js js/phase6.js js/firebase.js
          git commit -m "Stabilize Meetings mount and Agenda controls"
          git push origin HEAD:main
