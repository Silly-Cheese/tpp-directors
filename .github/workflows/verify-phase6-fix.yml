name: Verify Phase 6 fix

on:
  push:
    paths:
      - .github/workflows/verify-phase6-fix.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check js/phase6.js && node --check js/firebase.js
      - name: Verify native agenda controls
        run: |
          grep -q 'phase6-type-picker' js/phase6.js
          grep -q 'agendaDraft' js/phase6.js
          grep -q 'captureAgendaDraft' js/phase6.js
          grep -q 'phase6-add-agenda-button' phase6.css
          ! grep -q 'phase6-agenda-draft.js' js/firebase.js
