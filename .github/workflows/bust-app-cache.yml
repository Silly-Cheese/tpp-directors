name: Bust App Router Cache

on:
  push:
    paths:
      - .github/workflows/bust-app-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app script URL
        run: |
          python .github/scripts/bust_app_cache.py
          grep -q 'app.js?v=20260817-stable3' index.html
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust cached portal router script"
          git push origin HEAD:main
