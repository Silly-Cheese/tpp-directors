name: Stabilize Portal Boot and CSS

on:
  push:
    paths:
      - .github/workflows/stabilize-boot-css.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic boot and CSS patch
        run: |
          python .github/scripts/stabilize_boot_css.py
          node --check js/phase5.js
          node --check js/phase6.js
          node --check js/firebase.js
          node --check js/portal-theme-v3.js
          grep -q 'data-phase5-styles' index.html
          grep -q 'data-phase10-styles' index.html
          grep -q 'id="tpp-portal-theme-v3"' index.html
          grep -q 'script type="module" src="./js/phase5.js?v=20260817-stable2"' index.html
          grep -q 'script type="module" src="./js/phase6.js?v=20260817-stable2"' index.html
          grep -q 'Mount the real Meeting Room immediately' js/phase5.js
          ! grep -q 'phase5.js?v=20260817-stable1' js/firebase.js
          ! grep -q 'phase6.js?v=20260817-stable1' js/firebase.js
      - name: Commit stabilized boot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/phase5.js js/firebase.js js/portal-theme-v3.js
          git commit -m "Make portal boot and theme deterministic"
          git push origin HEAD:main
