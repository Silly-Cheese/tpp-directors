name: Apply Firestore rules syntax fix

on:
  push:
    paths:
      - '.github/workflows/apply-firestore-rules-syntax-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch rules
        run: python tools/fix-firestore-rules-syntax.py
      - name: Commit repaired rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Apply parser-safe Firestore check-in rules" || exit 0
          git push
