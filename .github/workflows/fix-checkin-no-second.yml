name: Fix Check-In and Remove Second Requirement
on:
  push:
    paths:
      - 'scripts/fix-checkin-no-second.py'
      - '.github/workflows/fix-checkin-no-second.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply stable6 repair
        run: python3 scripts/fix-checkin-no-second.py
      - name: Verify JavaScript
        run: |
          node --check js/meeting-data.js
          node --check js/phase5.js
          node --check js/governance-data.js
          node --check js/phase6.js
          node --check js/boot-stable.js
      - name: Verify rules/source assertions
        run: |
          grep -q "resource.data.status in \['ready','pending_second'\]" firestore.rules
          grep -q "Second not required" js/phase6.js
          ! grep -q "Awaiting second" js/phase6.js
          grep -q "20260817-stable6" index.html
      - name: Commit repaired portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/meeting-data.js js/phase5.js js/governance-data.js js/phase6.js js/boot-stable.js firestore.rules index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix meeting check-in and remove motion second requirement"
          git push
