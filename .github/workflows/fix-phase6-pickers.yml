name: Fix Phase 6 pickers

on:
  push:
    paths:
      - .github/scripts/fix_phase6_pickers.py
      - .github/workflows/fix-phase6-pickers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Phase 6 controls
        run: python .github/scripts/fix_phase6_pickers.py
      - name: Verify Phase 6 JavaScript
        run: |
          node --check js/phase6.js
          grep -q 'data-phase6-type-choice' js/phase6.js
          grep -q 'toggle-document-picker' js/phase6.js
          grep -q 'phase6-document-trigger' phase6.css
      - name: Commit picker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase6.js phase6.css
          git commit -m "Replace Phase 6 agenda selectors with deterministic button controls"
          git push origin HEAD:main
