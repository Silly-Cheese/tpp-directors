name: Verify Firestore rules

on:
  push:
    paths:
      - '.github/workflows/verify-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile rules with Firestore emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-tpp-direc "echo firestore-rules-compiled"
      - name: Record successful compile
        run: |
          mkdir -p .verification
          printf 'Firestore rules compiled successfully at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .verification/firestore-rules-compiled.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/firestore-rules-compiled.txt
          git commit -m "Verify Firestore rules compile" || exit 0
          git push
