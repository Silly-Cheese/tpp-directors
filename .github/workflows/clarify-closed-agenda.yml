name: Clarify Closed Meeting Agenda

on:
  push:
    paths:
      - .github/workflows/clarify-closed-agenda.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and verify
        run: |
          python .github/scripts/clarify_closed_agenda.py
          node --check js/phase6.js
          grep -q 'Meeting Closed' js/phase6.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase6.js
          git commit -m "Clarify closed meeting agenda state"
          git push origin HEAD:main
