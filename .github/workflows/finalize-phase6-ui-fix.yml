name: Finalize Phase 6 UI fix

on:
  push:
    paths:
      - .github/workflows/finalize-phase6-ui-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fold Prayer Project theme into Phase 6 CSS and clean obsolete helper
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('phase6.css')
          theme = Path('phase6-prayer-theme.css')
          text = css.read_text()
          theme_text = theme.read_text() if theme.exists() else ''
          marker = '/* Prayer Project native Phase 6 agenda redesign */'
          if theme_text and '/* Integrated Prayer Project Phase 6 theme */' not in text:
              if marker not in text:
                  raise SystemExit('agenda redesign marker not found')
              integrated = '/* Integrated Prayer Project Phase 6 theme */\n' + theme_text + '\n\n'
              text = text.replace(marker, integrated + marker, 1)
              css.write_text(text)

          # Make the favicon/theme available before JS modules start.
          index = Path('index.html')
          html = index.read_text()
          if 'href="./favicon.svg"' not in html:
              html = html.replace('<meta name="description" content="The Prayer Project Board of Directors governance portal.">', '<meta name="description" content="The Prayer Project Board of Directors governance portal.">\n  <link rel="icon" type="image/svg+xml" href="./favicon.svg">', 1)
          if 'href="./prayer-project-brand.css"' not in html:
              html = html.replace('<link rel="stylesheet" href="./styles.css">', '<link rel="stylesheet" href="./styles.css">\n  <link rel="stylesheet" href="./prayer-project-brand.css">\n  <link rel="stylesheet" href="./form-contrast.css">', 1)
          index.write_text(html)
          PY

          rm -f js/phase6-agenda-draft.js phase6-prayer-theme.css

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A phase6.css index.html js/phase6-agenda-draft.js phase6-prayer-theme.css
          git commit -m "Finalize native Phase 6 agenda UI and remove obsolete helper"
          git push origin HEAD:main
