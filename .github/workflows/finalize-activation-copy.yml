name: Finalize activation recovery

on:
  push:
    paths:
      - .github/workflows/finalize-activation-copy.yml

permissions:
  contents: write

jobs:
  verify-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct copy and verify runtime files
        run: |
          python .github/scripts/finalize_activation_copy.py
          node --check js/firebase.js
          node --check js/account-lifecycle.js
          node --check js/portal-contrast-v2.js
          node --check js/founder-admin.js
          node --check js/app.js
          grep -q 'activationVault' firestore.rules
          grep -q 'account-lifecycle.js' js/firebase.js
          grep -q 'portal-contrast-v2.js' js/firebase.js
          test -s portal-contrast-v2.css
          python - <<'PY'
          from pathlib import Path
          css = Path('portal-contrast-v2.css').read_text()
          assert css.count('{') == css.count('}'), 'contrast CSS braces are unbalanced'
          print('contrast CSS balanced')
          PY
      - name: Commit corrected security copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update activation recovery security copy"
          git push origin HEAD:main
