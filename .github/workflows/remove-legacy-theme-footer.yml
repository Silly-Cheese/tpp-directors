name: Remove legacy theme footer

on:
  push:
    paths:
      - .github/workflows/remove-legacy-theme-footer.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy footer/theme links and verify runtime
        run: |
          python .github/scripts/remove_legacy_theme_footer.py
          node --check js/firebase.js
          node --check js/portal-theme-v3.js
          grep -q 'portal-theme-v3.js' js/firebase.js
          ! grep -q 'prayer-project-brand.css' index.html
          ! grep -q 'form-contrast.css' index.html
          ! grep -q '<footer>' index.html
          test -s portal-theme-v3.css
          python - <<'PY'
          from pathlib import Path
          css = Path('portal-theme-v3.css').read_text()
          assert css.count('{') == css.count('}'), 'theme CSS braces are unbalanced'
          assert 'footer{display:none!important}' in css
          print('theme v3 verified')
          PY
      - name: Commit shell cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy white footer and competing theme links"
          git push origin HEAD:main
