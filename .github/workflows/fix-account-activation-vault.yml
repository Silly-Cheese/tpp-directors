name: Fix account activation vault

on:
  push:
    paths:
      - .github/workflows/fix-account-activation-vault.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch account lifecycle and rules
        run: |
          python .github/scripts/fix_account_activation_vault.py
          node --check js/founder-admin.js
          grep -q 'activationVault' js/founder-admin.js
          grep -q 'match /activationVault' firestore.rules
      - name: Commit activation vault support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/founder-admin.js firestore.rules
          git commit -m "Add Founder activation vault and duplicate-safe account creation"
          git push origin HEAD:main
