name: Apply Stable8 meeting number correction

on:
  push:
    paths:
      - '.github/workflows/apply-stable8-meeting-number.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/finalize-stable8.py
      - run: node --check js/meeting-data.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/meeting-data.js
          git commit -m "Finalize duplicate-safe meeting creation" || exit 0
          git push
