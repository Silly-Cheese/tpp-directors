name: Apply Prayer Project portal branding

on:
  push:
    paths:
      - .github/workflows/apply-prayer-project-brand.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add shared brand assets to portal head
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          old_theme = '<meta name="theme-color" content="#0b1730">'
          if old_theme in text:
              text = text.replace(old_theme, '<meta name="theme-color" content="#000000">', 1)

          styles = '<link rel="stylesheet" href="./styles.css">'
          brand_block = '''<link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./prayer-project-brand.css">'''
          if 'href="./prayer-project-brand.css"' not in text:
              if styles not in text:
                  raise SystemExit("styles.css link not found")
              text = text.replace(styles, brand_block, 1)

          path.write_text(text)

      - name: Commit branded portal head
        run: |
          if git diff --quiet -- index.html; then
            echo "Portal head already loads Prayer Project branding."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Prayer Project branding before portal render"
          git push origin HEAD:main
