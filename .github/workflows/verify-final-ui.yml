name: Verify final portal UI

on:
  push:
    paths:
      - .github/workflows/verify-final-ui.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/firebase.js
          node --check js/phase6.js
          node --check js/portal-final-ui.js
      - name: Verify final UI wiring
        run: |
          grep -q 'portal-final-ui.js' js/firebase.js
          grep -q 'portal-final.css' js/portal-final-ui.js
          grep -q 'data-phase6-type-choice' js/phase6.js
          grep -q 'data-phase6-document-choice' js/phase6.js
          test -s portal-final.css
      - name: Basic CSS brace sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('portal-final.css').read_text()
          assert text.count('{') == text.count('}'), 'portal-final.css has unbalanced braces'
          print('portal-final.css braces balanced')
          PY
