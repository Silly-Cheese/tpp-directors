name: Finalize Stable8 portal repair

on:
  push:
    paths:
      - '.github/workflows/finalize-stable8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize idempotent meeting number
        run: python tools/finalize-stable8.py
      - name: Verify JavaScript syntax
        run: |
          node --check js/phase5.js
          node --check js/meeting-data.js
          node --check js/permissions.js
          node --check js/phase6.js
          node --check js/boot-stable.js
      - name: Compile Firestore rules
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-tpp-direc "echo firestore-rules-compiled"
      - name: Commit final Stable8 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/meeting-data.js
          git commit -m "Finalize duplicate-safe meeting creation" || exit 0
          git push
