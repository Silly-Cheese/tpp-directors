name: Improve Check-In Feedback
on:
  push:
    paths:
      - 'scripts/improve-checkin-feedback.py'
      - '.github/workflows/improve-checkin-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply feedback patch
        run: python3 scripts/improve-checkin-feedback.py
      - name: Verify
        run: |
          node --check js/phase5.js
          node --check js/boot-stable.js
          grep -q "Checking in…" js/phase5.js
          grep -q "20260817-stable7" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/phase5.js js/boot-stable.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve meeting check-in feedback"
          git push
